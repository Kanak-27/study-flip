name: Frontend CI/CD

# Builds the Vite app and rsyncs client/dist to the EC2 instance's nginx root.
#
# Secrets:   EC2_HOST, EC2_USER, EC2_SSH_KEY
# Variables: EC2_PORT (default 22), FRONTEND_DEPLOY_PATH, VITE_API_BASE (optional)
#
# The SSH user must be able to write to FRONTEND_DEPLOY_PATH and run
# `sudo -n systemctl reload nginx`. Leave VITE_API_BASE unset when nginx proxies
# /api to the backend on the same host.

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build client
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build -w client

      - name: Configure SSH
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_PORT: ${{ vars.EC2_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_PORT: ${{ vars.EC2_PORT || 22 }}
          DEPLOY_PATH: ${{ vars.FRONTEND_DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_PATH" ]; then
            echo "FRONTEND_DEPLOY_PATH is not set" >&2
            exit 1
          fi

          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=10" \
            client/dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            "sudo -n /usr/sbin/nginx -t && sudo -n /usr/bin/systemctl reload nginx"
